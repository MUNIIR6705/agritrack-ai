{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-success">
                <div class="card-header bg-success text-white">
                    <h4>💰 Sell Animal: {{ animal.tag_number }}</h4>
                </div>
                <div class="card-body">
                    <p><strong>Breed:</strong> {{ animal.breed }}</p>
                    <p><strong>Current Weight:</strong> {{ animal.weight }} kg</p>
                    <hr>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid gap-2 mt-3">
                            <button type="submit" class="btn btn-success fw-bold">List for Sale</button>
                            <a href="{% url 'animal_detail' animal.id %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
