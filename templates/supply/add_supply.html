{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-white py-3 text-center border-bottom">
                <h4 class="fw-bold mb-0 text-dark">➕ Add Inventory</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-uppercase text-muted">Item Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g., Pig Starter Pellets" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-uppercase text-muted">Category</label>
                        <select name="supply_type" class="form-select" required>
                            <option value="Feed">Feed</option>
                            <option value="Medicine">Medicine</option>
                            <option value="Equipment">Equipment</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold small text-uppercase text-muted">Quantity</label>
                            <input type="number" step="0.01" name="quantity" class="form-control" placeholder="e.g., 50" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold small text-uppercase text-muted">Unit</label>
                            <input type="text" name="unit" class="form-control" value="kg" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-uppercase text-muted">Minimum Stock Alert Level</label>
                        <input type="number" step="0.01" name="min_stock_level" class="form-control" placeholder="Alert me when below... (e.g., 10)" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Save to Inventory</button>
                    <a href="{% url 'inventory_list' %}" class="btn btn-link w-100 text-muted text-decoration-none mt-2 text-center d-block">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
