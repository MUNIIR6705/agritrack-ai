{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-success text-white text-center py-4">
                    <h3 class="mb-0 fw-bold">🌾 AgriTrack Login</h3>
                    <small>Farmer Access Portal</small>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success btn-lg fw-bold">
                                🚜 Login to Dashboard
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer bg-light text-center py-3">
                    <p class="mb-2">Don't have an account? <a href="{% url 'register' %}" class="text-success fw-bold">Register Here</a></p>
                    <hr>
                    <p class="small text-muted mb-0">System Administrator?</p>
                    <a href="/admin/" class="btn btn-outline-dark btn-sm mt-1">
                        🔐 Go to Admin Panel
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
