{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow text-center">
                <div class="card-header bg-danger text-white">
                    <h4>🔒 Sign Out</h4>
                </div>
                <div class="card-body py-5">
                    <h5 class="card-title mb-4">Are you sure you want to sign out?</h5>
                    <p class="text-muted mb-4">You will need to log in again to access your farm data.</p>

                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <div class="d-grid gap-2 col-6 mx-auto">
                            <button type="submit" class="btn btn-danger fw-bold">Yes, Sign Out</button>
                            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
