{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden force-white-card">
                
                <div class="card-header border-0 p-4 text-center force-dark-header">
                    <div class="mb-3 d-flex justify-content-center">
                        <div class="d-flex align-items-center justify-content-center rounded-circle shadow-sm force-neon-circle">
                            <i class="fas fa-venus-mars fa-2x force-neon-icon"></i>
                        </div>
                    </div>
                    <h3 class="fw-bold mb-1 force-white-text">Record New Mating</h3>
                    <p class="small mb-0 force-muted-text">AI-Powered Gestation Forecasting</p>
                </div>
                
                <div class="card-body bg-white p-4 p-md-5">
                    <form method="POST" action="{% url 'breeding:add_breeding' %}" id="mating-form">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-uppercase force-dark-label">Select Mother (Female Only)</label>
                            <select name="animal" id="animal-select" class="form-select form-select-lg custom-white-input" required>
                                <option value="">Select Animal...</option>
                                {% for animal in animals %}
                                    <option value="{{ animal.id }}">{{ animal.tag_number }} ({{ animal.species }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-uppercase force-dark-label">Mating Date</label>
                                <input type="date" name="mating_date" id="mating-date" class="form-control form-control-lg custom-white-input" required value="{{ today|date:'Y-m-d' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-uppercase force-dark-label">Sire / Father Tag</label>
                                <input type="text" name="sire" class="form-control form-control-lg custom-white-input" placeholder="Optional">
                            </div>
                        </div>

                        <div id="ai-result-card" class="prediction-box text-center p-4 rounded-4 mb-4 d-none">
                            <span class="badge rounded-pill mb-3 px-3 py-2 fw-bold force-neon-badge">
                                <i class="fas fa-robot me-1"></i> AI PREDICTION RESULT
                            </span>
                            <h2 class="fw-bold mb-1 force-dark-text" id="predicted-date-text">...</h2>
                            <p class="small fw-semibold mb-2" style="color: #64748b !important;">Expected Gestation: <span id="gestation-days">0</span> days</p>
                            <div class="mt-2 small fw-bold force-success-text">
                                <i class="fas fa-shield-check me-1"></i> Confidence: <span id="confidence-text">0%</span>
                            </div>
                        </div>

                        <div class="d-grid gap-3">
                            <button type="button" id="run-ai-btn" class="btn btn-lg fw-bold py-3 shadow-sm rounded-pill btn-run-ai">
                                <i class="fas fa-magic me-2" id="ai-icon"></i> Run AI Prediction
                            </button>
                            
                            <button type="submit" id="save-record-btn" class="btn btn-lg fw-bold py-3 shadow-sm rounded-pill btn-save-record d-none">
                                <i class="fas fa-save me-2"></i> Save Record
                            </button>

                            <a href="{% url 'breeding:breeding_list' %}" class="btn w-100 fw-bold cancel-link">
                                Cancel & Return
                            </a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
document.getElementById('run-ai-btn').addEventListener('click', function() {
    const animalId = document.getElementById('animal-select').value;
    const matingDate = document.getElementById('mating-date').value;
    const btn = this;
    const aiIcon = document.getElementById('ai-icon');

    if (!animalId || !matingDate) {
        alert("Please select an animal and mating date first!");
        return;
    }

    // Start Loading State
    btn.disabled = true;
    aiIcon.className = "fas fa-spinner fa-spin me-2";
    btn.innerHTML = `<i class="fas fa-spinner fa-spin me-2" id="ai-icon"></i> Consulting AI Models...`;

    // Fetch the prediction from your API
    fetch(`{% url 'breeding:predict_gestation_api' %}?animal_id=${animalId}&mating_date=${matingDate}`)
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert("Error: " + data.error);
                // Reset button on error
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-magic me-2" id="ai-icon"></i> Run AI Prediction`;
            } else {
                // Fill and Show Result
                document.getElementById('predicted-date-text').innerText = data.formatted_date;
                document.getElementById('gestation-days').innerText = data.days;
                document.getElementById('confidence-text').innerText = data.confidence;
                
                document.getElementById('ai-result-card').classList.remove('d-none');
                document.getElementById('save-record-btn').classList.remove('d-none');
                
                // Hide the 'Run AI' button now that we have the result
                btn.classList.add('d-none');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("System error communicating with AI server.");
            // Reset button on error
            btn.disabled = false;
            btn.innerHTML = `<i class="fas fa-magic me-2" id="ai-icon"></i> Run AI Prediction`;
        });
});
</script>

<style>
    /* Nuke the Yellow Header and force Dark Green */
    .force-dark-header { background-color: #022a1c !important; }
    .force-white-card { background-color: #ffffff !important; }
    
    /* Text Colors */
    .force-white-text { color: #ffffff !important; }
    .force-muted-text { color: #94a3b8 !important; letter-spacing: 0.5px !important; }
    .force-dark-label { color: #04432a !important; }
    .force-dark-text { color: #022a1c !important; }
    .force-success-text { color: #059669 !important; }

    /* Neon Accents */
    .force-neon-circle { width: 60px !important; height: 60px !important; background-color: rgba(189, 242, 65, 0.15) !important; }
    .force-neon-icon { color: #bdf241 !important; }
    .force-neon-badge { background-color: #022a1c !important; color: #bdf241 !important; letter-spacing: 1px !important; }

    /* Input Styling */
    .custom-white-input {
        border-radius: 8px !important;
        border: 2px solid #e2e8f0 !important;
        background-color: #f8fafc !important;
        color: #0f172a !important;
        padding: 0.75rem 1rem !important;
        transition: all 0.2s ease !important;
    }
    
    .custom-white-input:focus {
        border-color: #04432a !important; 
        background-color: #ffffff !important;
        box-shadow: 0 0 0 4px rgba(189, 242, 65, 0.2) !important; 
        outline: none !important;
    }

    /* AI Prediction Box */
    .prediction-box {
        background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%) !important;
        border: 2px dashed #94a3b8 !important;
        transition: all 0.3s ease-in-out !important;
    }

    /* Run AI Button (Neon Outlined) */
    .btn-run-ai {
        background-color: transparent !important;
        color: #bdf241 !important;
        border: 2px solid #bdf241 !important;
        background-color: #022a1c !important; /* Start with dark background so neon pops */
        transition: all 0.2s ease !important;
    }
    .btn-run-ai:hover {
        background-color: #bdf241 !important;
        color: #022a1c !important;
        transform: translateY(-2px) !important;
    }

    /* Final Save Button (Deep Green) */
    .btn-save-record {
        background-color: #04432a !important; 
        color: #ffffff !important;
        border: none !important;
        transition: all 0.2s ease !important;
    }
    .btn-save-record:hover {
        background-color: #022a1c !important; 
        color: #bdf241 !important; 
        transform: translateY(-2px) !important;
    }

    /* Cancel Link Styling */
    .cancel-link {
        color: #64748b !important;
        transition: all 0.2s ease !important;
    }
    .cancel-link:hover {
        color: #0f172a !important;
        text-decoration: underline !important;
    }
</style>
{% endblock %}
