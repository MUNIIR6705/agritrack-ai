{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="fw-bold mb-4">📊 Farm Analytics & Insights</h2>

    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">Herd Composition</div>
                <div class="card-body">
                    <canvas id="speciesChart"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-header bg-success text-white">Herd Status</div>
                <div class="card-body">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    // 1. SPECIES CHART
    const ctx1 = document.getElementById('speciesChart').getContext('2d');
    new Chart(ctx1, {
        type: 'pie',
        data: {
            labels: {{ species_labels|safe }},
            datasets: [{
                data: {{ species_counts|safe }},
                backgroundColor: ['#0d6efd', '#ffc107', '#198754', '#dc3545'],
            }]
        }
    });

    // 2. STATUS CHART
    const ctx2 = document.getElementById('statusChart').getContext('2d');
    new Chart(ctx2, {
        type: 'doughnut',
        data: {
            labels: {{ status_labels|safe }},
            datasets: [{
                data: {{ status_counts|safe }},
                backgroundColor: ['#198754', '#ffc107', '#6c757d'],
            }]
        }
    });
</script>
{% endblock content %}
