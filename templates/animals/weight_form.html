{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4>⚖️ Record Weight for {{ animal.tag_number }}</h4>
                </div>
                <div class="card-body">
                    <p>Current Weight: <strong>{{ animal.weight }} kg</strong></p>

                    <form method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success">Save New Weight</button>
                            <a href="{% url 'animal_detail' animal.id %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
