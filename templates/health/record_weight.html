{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-white py-3 border-bottom text-center">
                <h4 class="fw-bold mb-0 text-dark">⚖️ Record Animal Weight</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{% url 'health:record_weight' %}">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-uppercase text-muted">Select Animal</label>
                        <select name="animal" class="form-select shadow-sm" required>
                            <option value="" disabled {% if not preselected_id %}selected{% endif %}>Choose from your livestock...</option>
                            {% for animal in animals %}
                                <option value="{{ animal.id }}" 
                                    {% if preselected_id|slugify == animal.id|slugify %}selected{% endif %}>
                                    {{ animal.tag_number }} - {{ animal.species }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-uppercase text-muted">Current Weight (kg)</label>
                        <div class="input-group shadow-sm">
                            <input type="number" step="0.01" name="weight" class="form-control" placeholder="0.00" required>
                            <span class="input-group-text bg-light fw-bold">KG</span>
                        </div>
                        <div class="form-text mt-2 small">Regular weighing helps predict market readiness.</div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success py-2 fw-bold shadow-sm" style="background-color: var(--agri-primary);">
                            Save Weight Record
                        </button>
                        
                        <a href="{% url 'health:health_dashboard' %}" class="btn btn-outline-secondary py-2 small fw-bold text-decoration-none text-center">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

[Image of a weight tracking chart for livestock growth analysis]

{% endblock %}
