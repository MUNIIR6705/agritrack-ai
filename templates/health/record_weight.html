{% extends "base.html" %}

{% block content %}
<style>
    .glass-card {
        background: rgba(255, 255, 255, 0.05) !important;
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 25px;
        color: white !important;
    }

    .form-label {
        color: var(--glow-lime, #b2ff59) !important;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 1px;
    }

    .form-control, .form-select {
        background: rgba(0, 0, 0, 0.3) !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        color: white !important;
        border-radius: 12px;
        padding: 12px;
    }

    .form-control:focus, .form-select:focus {
        border-color: var(--glow-lime, #b2ff59) !important;
        box-shadow: 0 0 15px rgba(178, 255, 89, 0.2);
        color: white !important;
    }

    .input-group-text {
        background: rgba(178, 255, 89, 0.2) !important;
        border: 1px solid rgba(178, 255, 89, 0.3) !important;
        color: var(--glow-lime, #b2ff59) !important;
        font-weight: 800;
    }

    .btn-save {
        background: #00a651 !important;
        border: none;
        border-radius: 50px;
        padding: 12px;
        font-weight: 800;
        transition: 0.3s;
    }

    .btn-save:hover {
        background: #b2ff59 !important;
        color: #001e14 !important;
        transform: translateY(-2px);
    }
</style>

<div class="row justify-content-center animate__animated animate__fadeIn">
    <div class="col-md-6 col-lg-5">
        <div class="card glass-card shadow-lg mt-4">
            <div class="card-header bg-transparent py-4 border-bottom border-white border-opacity-10 text-center">
                <h4 class="fw-bold mb-0 text-white">⚖️ Weight Registry</h4>
                <small class="text-white-50">Sync biological mass to the AgriTrack network</small>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{% url 'health:record_weight' %}">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label">Target Bio-Asset</label>
                        <select name="animal" class="form-select" required>
                            <option value="" disabled {% if not preselected_id %}selected{% endif %}>Identify livestock node...</option>
                            {% for animal in animals %}
                                <option value="{{ animal.id }}" 
                                    {% if preselected_id|slugify == animal.id|slugify %}selected{% endif %}>
                                    {{ animal.tag_number }} [{{ animal.species }}]
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Measured Mass (kg)</label>
                        <div class="input-group">
                            <input type="number" step="0.01" name="weight" class="form-control" placeholder="0.00" required>
                            <span class="input-group-text">KG</span>
                        </div>
                        <div class="text-white-50 mt-2" style="font-size: 0.7rem;">
                            <i class="fa-solid fa-circle-info me-1"></i> Critical for market readiness predictions.
                        </div>
                    </div>

                    <div class="d-grid gap-3">
                        <button type="submit" class="btn btn-save text-white shadow-lg">
                            <i class="fa-solid fa-cloud-arrow-up me-2"></i> Commit to Cloud
                        </button>
                        
                        <a href="{% url 'health:health_dashboard' %}" class="btn btn-link text-white-50 text-decoration-none small fw-bold text-center">
                            <i class="fa-solid fa-xmark me-1"></i> Discard Entry
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
