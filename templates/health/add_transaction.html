{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="card shadow border-success border-opacity-50">
            <div class="card-header bg-success text-white py-3 d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold"><i class="fas fa-file-invoice-dollar me-2"></i>Add Financial Transaction</h4>
                <span class="badge bg-light text-success fw-bold">M-PESA DARAJA 3.0</span>
            </div>
            <div class="card-body p-4 bg-light">
                <form method="POST" id="transaction-form">
                    {% csrf_token %}
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-muted small text-uppercase">Transaction Type</label>
                            <select name="type" class="form-select border-success-subtle" required>
                                <option value="Income">🟢 Income (Money In)</option>
                                <option value="Expense">🔴 Expense (Money Out)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-muted small text-uppercase">Category</label>
                            <select name="category" class="form-select" required>
                                <option value="Animal Sale">Animal Sale</option>
                                <option value="Feed & Nutrition">Feed & Nutrition</option>
                                <option value="Veterinary & Medicine">Veterinary & Medicine</option>
                                <option value="Equipment">Equipment</option>
                                <option value="Labor">Labor</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small text-uppercase">Description</label>
                        <input type="text" name="description" class="form-control" placeholder="e.g., Sold 2 pigs to Nairobi Market" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-muted small text-uppercase">Amount (KES)</label>
                        <div class="input-group shadow-sm">
                            <span class="input-group-text fw-bold text-success border-success bg-white">KES</span>
                            <input type="number" name="amount" class="form-control border-success fs-5 fw-bold" placeholder="0.00" step="0.01" required>
                        </div>
                    </div>

                    <hr class="my-4">

                    <h6 class="fw-bold text-dark mb-3"><i class="fas fa-credit-card me-2 text-muted"></i>Payment Settlement</h6>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small text-uppercase">Payment Method</label>
                        <select id="payment-method" name="payment_method" class="form-select border-dark" required>
                            <option value="Cash">Cash</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="M-Pesa">📱 M-Pesa STK Push</option>
                        </select>
                    </div>

                    <div id="mpesa-fields" class="mb-4 p-3 border border-success rounded bg-success bg-opacity-10 animate__animated animate__fadeIn" style="display: none;">
                        <label class="form-label fw-bold text-success small text-uppercase">Safaricom Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-success text-white">📞 +254</span>
                            <input type="text" name="mpesa_number" class="form-control border-success" placeholder="712345678" maxlength="9">
                        </div>
                        <div class="form-text text-success small mt-2">
                            <i class="fas fa-info-circle me-1"></i> Mary will receive a secure PIN prompt on her handset.
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'health:financial_reports' %}" class="btn btn-outline-secondary px-4 rounded-pill">Cancel</a>
                        
                        <button type="submit" id="submit-btn" class="btn btn-success fw-bold px-4 shadow-sm rounded-pill">
                            <span id="btn-text">Process Transaction</span>
                            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none ms-2" role="status" aria-hidden="true"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const paymentMethodSelect = document.getElementById('payment-method');
    const mpesaDiv = document.getElementById('mpesa-fields');
    const mpesaInput = mpesaDiv.querySelector('input');
    const form = document.getElementById('transaction-form');
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');

    // Toggle M-Pesa Phone Field with visual feedback
    paymentMethodSelect.addEventListener('change', function() {
        if (this.value === 'M-Pesa') {
            mpesaDiv.style.display = 'block';
            mpesaInput.setAttribute('required', 'required');
            mpesaInput.focus();
        } else {
            mpesaDiv.style.display = 'none';
            mpesaInput.removeAttribute('required');
        }
    });

    // Handle Form Submission UI Sequence
    form.addEventListener('submit', function() {
        const method = paymentMethodSelect.value;
        
        // Disable button to prevent double-charging
        btn.disabled = true;
        btnSpinner.classList.remove('d-none');

        if (method === 'M-Pesa') {
            btnText.innerText = "Requesting STK Push...";
            btn.classList.replace('btn-success', 'btn-warning');
            
            // Set a secondary timeout text for the demo feel
            setTimeout(() => {
                btnText.innerText = "Waiting for Mary's PIN...";
            }, 2000);
        } else {
            btnText.innerText = "Securing Ledger...";
        }
    });
</script>

<style>
    .card { border-radius: 15px; overflow: hidden; }
    .input-group-text { border-radius: 10px 0 0 10px; }
    .form-control { border-radius: 0 10px 10px 0; }
    #mpesa-fields { transition: all 0.3s ease; }
</style>
{% endblock %}
