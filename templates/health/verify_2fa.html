{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
    .security-terminal {
        max-width: 500px;
        margin: 60px auto;
    }

    .glass-panel {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 30px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .otp-input {
        background: rgba(0, 0, 0, 0.3) !important;
        border: 1px solid var(--agri-green) !important;
        color: var(--agri-green) !important;
        font-size: 2.5rem !important;
        font-weight: 800 !important;
        letter-spacing: 10px;
        text-align: center;
        border-radius: 15px;
        padding: 20px;
        text-shadow: 0 0 10px rgba(178, 255, 89, 0.5);
    }

    .otp-input:focus {
        box-shadow: 0 0 20px rgba(178, 255, 89, 0.3) !important;
        outline: none;
    }

    .timer-ring {
        font-family: 'Courier New', Courier, monospace;
        color: #ff5252;
        font-weight: bold;
    }

    .security-icon-pulse {
        animation: pulse-ring 2s infinite;
    }

    @keyframes pulse-ring {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.7; }
        100% { transform: scale(1); opacity: 1; }
    }
</style>

<div class="container security-terminal animate__animated animate__fadeInDown">
    <div class="glass-panel p-5 text-center">
        <div class="mb-4">
            <div class="bg-success bg-opacity-10 d-inline-block rounded-circle p-4 mb-3 border border-success security-icon-pulse">
                <i class="fa-solid fa-shield-halved fa-3x text-success"></i>
            </div>
            <h2 class="text-white fw-bold">Secure Node Access</h2>
            <p class="text-white-50">Identity verification required for <b>{{ user.username }}</b></p>
        </div>

        <form method="POST" id="2faForm">
            {% csrf_token %}
            <div class="mb-4">
                <label class="text-success small text-uppercase mb-2 d-block" style="letter-spacing: 2px;">
                    Enter 6-Digit Verification Code
                </label>
                <input type="text" name="token" class="form-control otp-input" 
                       placeholder="000000" maxlength="6" pattern="\d{6}" 
                       inputmode="numeric" autocomplete="one-time-code" required autofocus>
                
                <div class="mt-3 text-white-50 small">
                    Check your email: <span class="text-info">{{ user.email }}</span>
                </div>
            </div>

            <button type="submit" class="btn btn-sync w-100 fw-bold py-3 mb-3 shadow-lg" id="verifyBtn">
                <i class="fa-solid fa-fingerprint me-2"></i>Verify Identity
            </button>
        </form>

        <div class="mt-4 border-top border-white border-opacity-10 pt-3">
            <p class="text-white-50 small mb-1">Code expires in: <span id="timer" class="timer-ring">10:00</span></p>
            <a href="{% url 'health:verify_2fa' %}" class="text-success text-decoration-none small fw-bold">
                <i class="fa-solid fa-rotate-right me-1"></i>Request New Code
            </a>
        </div>
    </div>

    <div class="text-center mt-4">
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-link text-white-50 text-decoration-none small">
                <i class="fa-solid fa-arrow-left-from-bracket me-1"></i>Cancel & Logout
            </button>
        </form>
    </div>
</div>

<script>
    // --- CSRF RELOAD FIX ---
    // If the user hits the "Back" button or the token is stale, 
    // this forces a refresh to get a new valid CSRF token.
    window.addEventListener( "pageshow", function ( event ) {
        var historyTraversal = event.persisted || 
                               ( typeof window.performance != "undefined" && 
                                 window.performance.navigation.type === 2 );
        if ( historyTraversal ) {
            window.location.reload();
        }
    });

    // 10 Minute Countdown Logic
    let time = 600;
    const timerEl = document.getElementById('timer');

    const countdown = setInterval(() => {
        if (time <= 0) {
            clearInterval(countdown);
            timerEl.innerHTML = "EXPIRED";
            return;
        }
        time--;
        const minutes = Math.floor(time / 60);
        let seconds = time % 60;
        seconds = seconds < 10 ? '0' + seconds : seconds;
        timerEl.innerHTML = `${minutes}:${seconds}`;
        if (time < 60) timerEl.style.color = '#ff5252';
    }, 1000);

    // Button loading state
    document.getElementById('2faForm').addEventListener('submit', function() {
        const btn = document.getElementById('verifyBtn');
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-2"></i>Decrypting Node...';
        btn.classList.add('disabled');
    });
</script>
{% endblock %}
