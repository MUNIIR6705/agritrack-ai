<div style="font-family: Arial, sans-serif; max-width: 600px; margin: auto; border: 1px solid #e0e0e0; border-radius: 10px; padding: 20px;">
    <div style="background-color: #00a651; color: white; padding: 15px; text-align: center; border-radius: 8px 8px 0 0;">
        <h2 style="margin: 0;">AgriTrack AI Security</h2>
    </div>
    <div style="padding: 20px; text-align: center;">
        <p>Hello <strong>{{ username }}</strong>,</p>
        <p>Use the secure verification code below to access your Farmer Identity Node:</p>
        <div style="font-size: 32px; font-weight: bold; color: #00a651; letter-spacing: 10px; margin: 25px 0; padding: 15px; background: #f4f4f4; border: 1px dashed #00a651; display: inline-block;">
            {{ token }}
        </div>
        <p style="color: #666; font-size: 12px;">This code expires in 10 minutes. If you did not request this, please ignore this email.</p>
    </div>
    <div style="border-top: 1px solid #eeeeee; padding-top: 15px; font-size: 11px; color: #999; text-align: center;">
        © 2026 AgriTrack AI Node Framework
    </div>
</div>
